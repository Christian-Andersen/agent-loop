[project]
name = "agent-loop"
version = "0.1.0"
description = "Local autonomous coding agent loop backed by an OpenAI-compatible LLM."
readme = "README.md"
authors = [
    { name = "Christian Andersen", email = "cdandersen98@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "pydantic-ai>=1.106.0",
    "pydantic-settings>=2.14.1",
    "python-telegram-bot>=22.7",
]

[project.scripts]
agent-loop = "agent_loop:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
