[project]
name = "agent-loop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Andersen", email = "cdandersen98@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
agent-loop = "agent_loop:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # missing-trailing-comma
]

[tool.ruff.lint.pydocstyle]
convention = "google"
